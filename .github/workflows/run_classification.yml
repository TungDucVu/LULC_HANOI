name: Schedule LULC Classification

on:
  schedule:
    # Run every 72 hours (every 3 days at 00:00 UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Enable manual run from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run classification script
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: |
          python classify_hanoi.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hanoi_lulc_district_areas.csv index.html
          git diff-index --quiet HEAD || git commit -m "Automated LULC classification run [skip ci]"
          git push
